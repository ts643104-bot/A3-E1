name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.{0}', github.run_number) }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # JDK 21 is required: capacitor.build.gradle compiles with JavaVersion.VERSION_21
      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint and sync native project
        run: |
          set -euo pipefail
          npm run lint
          npm run android:sync

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Build with Gradle
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace --info > ../gradle-build.log 2>&1
          code=$?
          set -e
          echo "gradle_exit=$code"
          msg="$(grep -m 40 -A 3 -E '^\* (What went wrong|Try:|Exception is)|FAILURE:|Execution failed for task|Caused by:' ../gradle-build.log | head -c 2000)"
          echo "::error title=Gradle failed::$(echo "$msg" | tr '\n' ' ')"
          echo '## Gradle failure' >> "$GITHUB_STEP_SUMMARY"
          printf '```\n%s\n```\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit $code
        working-directory: android

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Prepare APK asset
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apk" ]; then
            echo "::error title=APK not found::expected $apk"
            exit 1
          fi
          mkdir -p release
          cp "$apk" "release/A3E1-${VERSION_NAME}.apk"
          ls -l "release/A3E1-${VERSION_NAME}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: A3E1-APK-${{ env.VERSION_NAME }}
          path: release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: A3&E1 ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
          body: |
            Android debug APK for direct testing. This build is not signed for Google Play distribution.