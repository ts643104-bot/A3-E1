name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.{0}', github.run_number) }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint and sync native project
        run: |
          set -euo pipefail
          npm run lint
          npm run android:sync

      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon :app:assembleDebug --stacktrace --info > ../gradle-build.log 2>&1
          code=$?
          set -e
          echo "gradle_exit=$code"
          echo '## Gradle build log (last 80 lines)' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 ../gradle-build.log >> "$GITHUB_STEP_SUMMARY"
          exit $code
        working-directory: android

      - name: Locate and stage APK
        run: |
          set -euo pipefail
          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo '## APK output discovery' | tee -a "$summary_file"
          echo "Workspace: $GITHUB_WORKSPACE" | tee -a "$summary_file"
          find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print | tee /tmp/a3e1-apk-paths.txt
          cat /tmp/a3e1-apk-paths.txt | tee -a "$summary_file"
          apk_path="$(head -n 1 /tmp/a3e1-apk-paths.txt)"
          if [ -z "$apk_path" ]; then
            echo 'No APK file was generated anywhere in the workspace.' | tee -a "$summary_file"
            output_dirs="$(find "$GITHUB_WORKSPACE/android" -type d -name outputs -print | paste -sd ',' -)"
            echo "::error title=APK output not found::workspace=$GITHUB_WORKSPACE; outputs=${output_dirs:-none}; files=$(find "$GITHUB_WORKSPACE/android" -maxdepth 3 -type f -name '*.apk' -print | paste -sd ',' -)"
            exit 1
          fi
          mkdir -p release
          cp -- "$apk_path" "$GITHUB_WORKSPACE/release/A3E1-${VERSION_NAME}.apk"
          ls -l "$GITHUB_WORKSPACE/release/A3E1-${VERSION_NAME}.apk" | tee -a "$summary_file"

      - name: Summarize Gradle failure
        if: failure()
        run: |
          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ -f android/gradle-build.log ]; then
            echo '## Gradle build diagnostics' >> "$summary_file"
            tail -n 100 android/gradle-build.log >> "$summary_file"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: A3E1-APK-${{ env.VERSION_NAME }}
          path: release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: A3&E1 ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
          body: |
            Android debug APK for direct testing. This build is not signed for Google Play distribution.