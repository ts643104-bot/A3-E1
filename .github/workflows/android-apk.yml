name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.{0}', github.run_number) }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint and sync native project
        run: |
          npm run lint
          npm run android:sync

      - name: Build debug APK
        run: bash gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee gradle-build.log
        working-directory: android

      - name: Locate and stage APK
        run: |
          set -eo pipefail
          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo '## APK output discovery' | tee -a "$summary_file"
          echo "Workspace: $GITHUB_WORKSPACE" | tee -a "$summary_file"
          find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print | tee /tmp/a3e1-apk-paths.txt
          cat /tmp/a3e1-apk-paths.txt | tee -a "$summary_file"
          apk_path="$(head -n 1 /tmp/a3e1-apk-paths.txt)"
          if [ -z "$apk_path" ]; then
            echo 'No APK file was generated anywhere in the workspace.' | tee -a "$summary_file"
            exit 1
          fi
          mkdir -p release
          cp -- "$apk_path" "$GITHUB_WORKSPACE/release/A3E1-${VERSION_NAME}.apk"
          ls -l "$GITHUB_WORKSPACE/release/A3E1-${VERSION_NAME}.apk" | tee -a "$summary_file"

      - name: Summarize Gradle failure
        if: failure()
        run: |
          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ -f android/gradle-build.log ]; then
            echo '## Gradle build diagnostics' >> "$summary_file"
            tail -n 100 android/gradle-build.log >> "$summary_file"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: A3E1-APK-${{ env.VERSION_NAME }}
          path: release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: A3&E1 ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
          body: |
            Android debug APK for direct testing. This build is not signed for Google Play distribution.